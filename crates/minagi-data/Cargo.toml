[package]
name = "minagi-data"
description = "Dataset manager: folder scan, lane detection, train/validation split, linking, synthetic text and starter downloads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
minagi-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand.workspace = true
rand_chacha.workspace = true
# Folder walking and parallel sniffing (limited to 4 threads in code).
walkdir = "2"
rayon = "1"
# Hashing: blake3 orders files for the split, sha2 verifies downloads.
blake3 = "1"
sha2 = "0.10"
memchr = "2"
# Copy-on-write clones for materialize; free-space query for the downloader (macOS, Linux, Windows).
reflink-copy = "0.1"
fs4 = "0.13"
# Downloader: rustls (no native-tls), streaming bodies, cancellation.
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "sync", "io-util"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }

[dev-dependencies]
tempfile = "3"
# The downloader tests run a loopback HTTP server on tokio.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "fs", "sync"] }
